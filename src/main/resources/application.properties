spring.application.name=cocina
# ??? Base de datos H2 en memoria ?????????????????????????????????????
spring.datasource.url=jdbc:h2:mem:cocinadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ??? Consola web H2 ? http://localhost:8080/h2-console ???????????????
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ??? JPA / Hibernate ??????????????????????????????????????????????????
# create-drop: recrea tablas al arrancar, las borra al cerrar
# (cambiar a "update" cuando usemos PostgreSQL/MySQL)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ??? Datos de ejemplo (data.sql se ejecuta al arrancar) ???????????????
spring.sql.init.mode=always

# ??? Servidor ?????????????????????????????????????????????????????????
server.port=8080

